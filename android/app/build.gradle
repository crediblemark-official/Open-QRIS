plugins {
    id 'com.android.application'
}

android {
    namespace 'com.openqris.listener'
    compileSdk 34

    defaultConfig {
        applicationId "com.openqris.listener"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ""
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Zero bloated third-party dependencies required!
    // Native Android SDK provides standard NotificationListenerService & HttpURLConnection.
}
